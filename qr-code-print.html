<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display de Mesa — La Cabanne Benguela</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --ivory: #F8F6F0;
      --deep: #123E64;
      --blue: #2474B5;
      --line: #E3DCCE;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #EFEBE2;
      padding: 32px 16px;
    }

    .display-card {
      width: 100%;
      max-width: 440px;
      background: var(--ivory);
      border: 2px solid var(--line);
      border-radius: 28px;
      padding: 48px 36px 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(18, 62, 100, 0.12);
      position: relative;
    }

    .display-card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(18, 62, 100, 0.12);
      border-radius: 20px;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--deep);
      line-height: 1;
      margin-bottom: 6px;
    }

    .tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.15rem;
      color: #5F6B75;
      margin-bottom: 32px;
    }

    .qr-frame {
      display: inline-block;
      background: #FFFFFF;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(18, 62, 100, 0.15);
      box-shadow: 0 8px 24px rgba(18, 62, 100, 0.08);
      margin-bottom: 28px;
    }

    #qr-canvas {
      display: block;
      width: 260px;
      height: 260px;
    }

    #hidden-qr { display: none; }

    .instruction {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--deep);
      margin-bottom: 4px;
    }

    .sub-instruction {
      font-size: 0.8rem;
      color: #5F6B75;
      margin-bottom: 20px;
    }

    .website {
      font-family: monospace;
      font-size: 0.72rem;
      color: #8A949C;
      letter-spacing: 0.04em;
    }

    .print-bar {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--deep);
      color: #fff;
    }
    .btn-primary:hover { background: #0c2c49; }

    @media print {
      body { background: #fff; padding: 0; }
      .print-bar { display: none; }
      .display-card {
        box-shadow: none;
        max-width: 100%;
        border-color: #000;
      }
    }
  </style>
</head>
<body>

  <div class="display-card">
    <p class="eyebrow">Menu Digital</p>
    <h1>La Cabanne</h1>
    <p class="tagline">Restaurante & Lounge · Benguela</p>

    <div class="qr-frame">
      <canvas id="qr-canvas" width="1000" height="1000"></canvas>
    </div>

    <p class="instruction">Consulte o nosso cardápio</p>
    <p class="sub-instruction">Aponte a câmara do seu telemóvel para o código</p>

    <p class="website">la-cabanne-six.vercel.app</p>
  </div>

  <div id="hidden-qr"></div>

  <div class="print-bar">
    <button class="btn btn-primary" onclick="window.print()">🖨 Imprimir Display de Mesa</button>
  </div>

  <script>
    const URL = "https://la-cabanne-six.vercel.app/";
    const SIZE = 1000;

    const hidden = document.getElementById("hidden-qr");
    new QRCode(hidden, {
      text: URL,
      width: SIZE,
      height: SIZE,
      colorDark: "#123E64",
      colorLight: "#FFFFFF",
      correctLevel: QRCode.CorrectLevel.H
    });

    const emblem = new Image();
    emblem.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="142" fill="#F8F6F0" stroke="#123E64" stroke-width="8"/>
        <circle cx="150" cy="150" r="116" fill="#123E64"/>
        <text x="150" y="178" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="105" letter-spacing="-4" fill="#F8F6F0">LC</text>
        <text x="150" y="210" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="600" font-size="14" letter-spacing="3" fill="#2474B5">LA CABANNE</text>
      </svg>
    `);

    function render() {
      const srcCanvas = hidden.querySelector("canvas");
      if (!srcCanvas) {
        setTimeout(render, 100);
        return;
      }

      const canvas = document.getElementById("qr-canvas");
      const ctx = canvas.getContext("2d");

      // Draw base QR
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.drawImage(srcCanvas, 0, 0, SIZE, SIZE);

      // Draw center emblem
      const badgeSize = Math.round(SIZE * 0.28);
      const pos = (SIZE - badgeSize) / 2;

      ctx.save();
      ctx.beginPath();
      ctx.arc(SIZE / 2, SIZE / 2, (badgeSize / 2) + 10, 0, Math.PI * 2);
      ctx.fillStyle = "#FFFFFF";
      ctx.shadowColor = "rgba(18, 62, 100, 0.2)";
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.restore();

      ctx.drawImage(emblem, pos, pos, badgeSize, badgeSize);
    }

    emblem.onload = () => {
      setTimeout(render, 250);
    };
  </script>
</body>
</html>
